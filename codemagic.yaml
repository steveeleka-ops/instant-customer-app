workflows:
  ios-release:
    name: iOS Release (IPA)
    max_build_duration: 90
    integrations:
      app_store_connect: Codemagic
    environment:
      flutter: 3.22.3
      xcode: 26.0
      cocoapods: default
      groups:
        - ios_credentials
        - email_credentials
    scripts:
      - name: Set up keychain
        script: keychain initialize
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "com.app.steve.instant" \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create
      - name: Add certificates to keychain
        script: keychain add-certificates
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Get packages
        script: flutter pub get
      - name: Patch third-party packages
        script: |
          PICKER_TILE="$HOME/.pub-cache/hosted/pub.dev/google_maps_place_picker_mb-3.0.2/lib/src/components/prediction_tile.dart"
          [ -f "$PICKER_TILE" ] && sed -i '' 's/\.bodyText2/\.bodyMedium/g' "$PICKER_TILE" && echo "Patched prediction_tile.dart"
          PLACE_PICKER="$HOME/.pub-cache/hosted/pub.dev/google_maps_place_picker_mb-3.0.2/lib/src/place_picker.dart"
          [ -f "$PLACE_PICKER" ] && sed -i '' 's/Theme\.of(context)\.errorColor/Theme.of(context).colorScheme.error/g' "$PLACE_PICKER" && echo "Patched place_picker.dart"
          GET_EXT="$HOME/.pub-cache/hosted/pub.dev/get-4.6.5/lib/get_navigation/src/extension_navigation.dart"
          [ -f "$GET_EXT" ] && sed -i '' 's/theme\.backgroundColor/theme.colorScheme.surface/g' "$GET_EXT" && echo "Patched get extension_navigation.dart"
      - name: Remove alpha channel from app icon
        script: |
          # Apple rejects icons with transparency (error 90717).
          # Flatten alpha onto white background using ImageMagick (available on Codemagic).
          convert assets/icon/icon.png -background white -alpha remove -alpha off assets/icon/icon.png
          echo "Alpha channel removed successfully"
      - name: Generate app icons
        script: flutter pub run flutter_launcher_icons:main
      - name: Build iOS IPA
        script: |
          # Patch export_options.plist: Xcode 16 requires 'app-store-connect' not 'app-store'
          if [ -f /Users/builder/export_options.plist ]; then
            plutil -replace method -string "app-store-connect" /Users/builder/export_options.plist || true
          fi
          flutter build ipa --release \
            --build-name=1.0.7 \
            --build-number=51 \
            --dart-define=RESEND_API_KEY=$RESEND_API_KEY \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: true

  android-release:
    name: Android Release (AAB)
    max_build_duration: 90
    environment:
      flutter: 3.22.3
      java: 17
      groups:
        - email_credentials
    scripts:
      - name: Set up local.properties
        script: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "flutter.versionName=1.0.7" >> android/local.properties
          echo "flutter.versionCode=51" >> android/local.properties
      - name: Get packages
        script: flutter pub upgrade
      - name: Generate app icons
        script: flutter pub run flutter_launcher_icons:main
      - name: Patch third-party packages for Flutter 3.22
        script: |
          # AGP 8.x requires namespace in every plugin's build.gradle.
          # Older plugins only declare it via package= in AndroidManifest.xml.
          # This patch reads that attribute and injects it into build.gradle.
          find $HOME/.pub-cache/hosted/pub.dev -path "*/android/build.gradle" | while read f; do
            if ! grep -q "namespace" "$f"; then
              MANIFEST="$(dirname "$f")/src/main/AndroidManifest.xml"
              if [ -f "$MANIFEST" ]; then
                NS=$(grep -o 'package="[^"]*"' "$MANIFEST" | head -1 | cut -d'"' -f2)
                if [ -n "$NS" ]; then
                  sed -i '' "s/android {/android {\n    namespace \"${NS}\"/" "$f"
                  echo "Patched namespace '${NS}': $f"
                fi
              fi
            fi
          done
          for f in $HOME/.pub-cache/hosted/pub.dev/google_maps_place_picker_mb-*/lib/src/components/prediction_tile.dart; do
            [ -f "$f" ] && sed -i '' 's/\.bodyText2/\.bodyMedium/g' "$f" && echo "Patched: $f"
          done
          for f in $HOME/.pub-cache/hosted/pub.dev/google_maps_place_picker_mb-*/lib/src/place_picker.dart; do
            [ -f "$f" ] && sed -i '' 's/Theme\.of(context)\.errorColor/Theme.of(context).colorScheme.error/g' "$f" && echo "Patched: $f"
          done
          GET_EXT="$HOME/.pub-cache/hosted/pub.dev/get-4.6.5/lib/get_navigation/src/extension_navigation.dart"
          [ -f "$GET_EXT" ] && sed -i '' 's/theme\.backgroundColor/theme.colorScheme.surface/g' "$GET_EXT" && echo "Patched get extension_navigation.dart"
          find $HOME/.pub-cache/hosted/pub.dev/google_api_headers-*/android -name "build.gradle" | while read f; do
            sed -i '' "s/ext\.kotlin_version = '[0-9][0-9.]*'/ext.kotlin_version = '1.9.0'/g" "$f"
            sed -i '' 's/kotlin-gradle-plugin:[0-9][0-9.]*/kotlin-gradle-plugin:1.9.0/g' "$f"
            if ! grep -q "jvmTarget" "$f"; then
              printf '\nafterEvaluate {\n    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {\n        kotlinOptions { jvmTarget = '"'"'1.8'"'"' }\n    }\n}\n' >> "$f"
            fi
            echo "Patched google_api_headers: $f"
          done
          find $HOME/.pub-cache/hosted/pub.dev/location-*/android -name "build.gradle" | while read f; do
            sed -i '' "s/ext\.kotlin_version = '[0-9][0-9.]*'/ext.kotlin_version = '1.9.0'/g" "$f"
            sed -i '' 's/kotlin-gradle-plugin:[0-9][0-9.]*/kotlin-gradle-plugin:1.9.0/g' "$f"
            if ! grep -q "jvmTarget" "$f"; then
              printf '\nafterEvaluate {\n    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {\n        kotlinOptions { jvmTarget = '"'"'1.8'"'"' }\n    }\n}\n' >> "$f"
            fi
            echo "Patched location: $f"
          done
      - name: Build Android App Bundle
        script: |
          flutter build appbundle --release \
            --build-name=1.0.7 \
            --build-number=51 \
            --dart-define=RESEND_API_KEY=$RESEND_API_KEY
    artifacts:
      - build/app/outputs/bundle/release/app-release.aab
